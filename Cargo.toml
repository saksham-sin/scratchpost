[package]
name = "scratchpost"
version = "0.2.0"
edition = "2021"
description = "Stop your parallel coding agents from scratching the same file"
repository = "https://github.com/saksham-sin/scratchpost"
homepage = "https://github.com/saksham-sin/scratchpost"
readme = "README.md"
keywords = ["git", "agents", "llm", "worktree", "concurrency"]
categories = ["development-tools"]
rust-version = "1.75"
license = "Apache-2.0"

[[bin]]
name = "sp"
path = "src/main.rs"

[dependencies]
libc = "0.2"
memmap2 = "0.9"
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = "z"
debug = false
